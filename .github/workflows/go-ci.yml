# 工作流的名称
name: CloudTask Go CI

# 触发条件：监听main分支的push，以及目标为main的PR
# 新加触发条件：推送Git版本标签作为发布这一版本镜像的信号
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 权限设置
permissions:
  # 读取仓库代码
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: im-sage/cloudtask-api

# 工作流中包含的任务
jobs:
  quality:  # 若不指定name则默认使用它的标识符quality
    name: Go quality checks
    runs-on: ubuntu-latest  # 使用GitHub托管的最新Ubuntu环境
    timeout-minutes: 15 # 这个job最长运行时间限制为15分钟

    # quality job中的所有run步骤(所有执行shell命令的步骤)设置为全部统一配置
    defaults:
      run:
        shell: bash  # 强制所有脚本命令都在bash环境中执行
        # 默认工作目录为当前仓库的根目录
        working-directory: .

    steps:
      # 步骤1：调用官方Action 把当前仓库的代码拉取到虚拟机中
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 步骤2：为 Runner 安装或选择指定的 Go 版本，并配置 Go 工具链。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 步骤3：执行gofmt, 查看代码是否格式化, 那些未格式化的文件吗保存到unformatted变量中
      - name: Check Go formatting
        # 如果该变量不为空，脚本就会打印出这些文件名，并执行 exit 1。
        run: |
          unformatted=$(gofmt -l ./day9)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要执行 gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      
      # 步骤4： 执行go vet 
      - name: Run go vet
        run: go vet ./day9/...

      # 步骤5： 执行API(Go 程序)编译 指定编译输出的二进制文件路径为"$RUNNER_TEMP/cloudtask-api"
      - name: Build 执行API
        run: go build -o "$RUNNER_TEMP/cloudtask-api" ./day9/cmd/server

      # 步骤6： 执行Go单元测试Step
      - name: Run Go unit tests
        run: go test -count=1 ./day9/...

      # 步骤7：检测测试执行过程中是否发生数据竞争
      - name: Run Go tests with race detector
        run: go test -race -count=1 ./day9/...

  
  integration:
    name: Run integration Job
    runs-on: ubuntu-latest  # 使用GitHub托管的最新Ubuntu环境
    timeout-minutes: 15 # 这个job最长运行时间限制为15分钟
    needs: quality

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cloudtask_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app -d cloudtask_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      
      redis:
        image: redis:8-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # job.services.postgres.id是 GitHub Actions 提供的 PostgreSQL 容器 ID。
      - name: Initialize PostgreSQL schema
        run: |
          docker exec -i -e PGPASSWORD=ci_test_password \
            "${{ job.services.postgres.id }}" \
            psql -h 127.0.0.1 -U app -d cloudtask_test -v ON_ERROR_STOP=1 \
            < day9/db/migrations/000001_init.up.sql

      - name: Run Go integration tests
        env:
          TEST_DATABASE_URL: postgres://app:ci_test_password@127.0.0.1:5432/cloudtask_test?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
        run: |
          go test -v -count=1 -tags=integration ./day9/internal/repository ./day9/internal/cache ./day9/internal/service


  docker-build:
      name: Build Docker Image
      # 因为这个Job有自己的runner，所以需要重新检出源码
      runs-on: ubuntu-latest
      needs: [quality, integration]
      timeout-minutes: 15

      env:
        IMAGE_NAME: cloudtask-api:ci

      steps:
        - name: Checkout code
          uses: actions/checkout@v7
          with:
            persist-credentials: false
  
        - name: Check Docker environment
          run: docker version

        - name: Build image
          run: docker build -f day9/Dockerfile -t "$IMAGE_NAME" .
        
          # | 代表执行一段多行的shell命令
        - name: Inspect image
          run: |
            docker image inspect \
              --format 'User={{.Config.User}} WorkDir={{.Config.WorkingDir}} Cmd={{json .Config.Cmd}}' \
              "$IMAGE_NAME"

        - name: Container smoke test
          run: |
            docker run --rm --entrypoint /bin/sh "$IMAGE_NAME" -ec '
              id
              ls -l /app/cloudtask-api
              test "$(id -u)" = "10001"
              test "$(id -g)" = "10001"
              test -f /app/cloudtask-api
              test -x /app/cloudtask-api
             '

  publish:
      name: Publish Docker Image
      # 因为这个Job有自己的runner，所以需要重新检出源码
      runs-on: ubuntu-latest
      needs: [quality, integration, docker-build]
      timeout-minutes: 15

      permissions:
        # 读取仓库源码
        contents: read
        # 推送GHCR镜像
        packages: write   # 必须写全，负责其余的权限都会设为none
      # 只有当事件时push，并且推送的目标是main分支或以v开头的Git标签时，才执行这个job
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

      steps:
        - name: Checkout Code
          uses: actions/checkout@v7
          with:
            persist-credentials: false

        - name: Login to GHCR
          uses: docker/login-action@v4
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        
        # 准备好后续构建镜像用的Buildx构建器
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
        
        # 根据镜像仓库名和本次Git事件，生成完整的镜像标签
        - name: Extract Docker Metadata
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            flavor: latest=false
            tags: |
              type=ref,event=branch
              type=ref,event=tag

        - name: Build and Push
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./day9/Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}