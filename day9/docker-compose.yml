services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudtask
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_only_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --loadmodule /usr/local/lib/redis/modules/redisbloom.so
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping'
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
      postgres_data: