services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudtask
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_only_local}
    ports:
      - "127.0.0.1:5432:5432"
        #宿主机ip   宿主机端口  容器端口
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: 
      - "CMD-SHELL"
      - 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -t 2'
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

    

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --loadmodule /usr/local/lib/redis/modules/redisbloom.so
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping'
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  

  api:
    image: cloudtask-api:2.3.3-health
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy


volumes:
      postgres_data: